name: C++ CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: cpp-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wasm-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned WASI SDK and Wasmtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kadoka-wasm-tools"
          cd "$RUNNER_TEMP/kadoka-wasm-tools"
          curl --fail --location --retry 3 --output wasi-sdk.tar.gz \
            https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz
          curl --fail --location --retry 3 --output wasmtime.tar.xz \
            https://github.com/bytecodealliance/wasmtime/releases/download/v49.0.3/wasmtime-v49.0.3-x86_64-linux.tar.xz
          printf '%s  %s\n' \
            b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4 wasi-sdk.tar.gz \
            4001225413f208345b980525f31c4080e1873808b38d0ddc7918497340667fbb wasmtime.tar.xz \
            | sha256sum --check
          tar -xzf wasi-sdk.tar.gz
          tar -xJf wasmtime.tar.xz
          echo "$PWD/wasmtime-v49.0.3-x86_64-linux" >> "$GITHUB_PATH"
          echo "KADOKA_WASI_SDK_ROOT=$PWD/wasi-sdk-34.0-x86_64-linux" >> "$GITHUB_ENV"

      - name: Configure real WASM integration tests
        run: >-
          cmake -S . -B build-wasm
          -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          -DKADOKA_ENABLE_WASM_TESTS=ON
          -DKADOKA_WASI_SDK_ROOT="$KADOKA_WASI_SDK_ROOT"

      - name: Build host executables and WASI modules
        run: cmake --build build-wasm --config Release --parallel 2

      - name: Test including real Wasmtime execution
        run: ctest --test-dir build-wasm -C Release --output-on-failure

  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate family model metadata
        run: >-
          python tools/family_metadata/script/validate_metadata.py --game othello
          src/packages/obake_kadoka/metadata.json
          src/packages/obake_maru/metadata.json

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Script Evaluator runtime benchmark
        run: >-
          ./build/kadoka_script_evaluator_benchmark 20
          build/generated/Release/python_evaluator.json
          build/generated/Release/native_process_evaluator.json
          build/generated/Release/in_process_evaluator.json

      - name: Obake headless runtime benchmark
        run: >-
          ./build/kadoka_headless_benchmark 2 8
          src/packages/obake_kadoka/manifest.json
          src/packages/obake_maru/manifest.json
          12345

      - name: Deterministic headless smoke
        run: ./build/kadoka_othello_headless 2 8 "" 12345

      - name: Configure Runtime-only build
        run: cmake -S . -B build-runtime -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DKADOKA_BUILD_AI_CREATOR=OFF

      - name: Build Runtime-only targets
        run: cmake --build build-runtime --config Release --target kadoka_othello_headless kadoka_othello_core_tests --parallel 2

      - name: Test Runtime-only core
        run: ctest --test-dir build-runtime -C Release -R '^kadoka_othello_core_tests$' --output-on-failure

      - name: Smoke Runtime-only headless
        run: ./build-runtime/kadoka_othello_headless 2 8 "" 12345
