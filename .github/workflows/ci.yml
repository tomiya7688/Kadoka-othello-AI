name: C++ CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: cpp-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Deterministic headless smoke
        run: ./build/kadoka_othello_headless 2 8 "" 12345

      - name: Configure Runtime-only build
        run: cmake -S . -B build-runtime -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DKADOKA_BUILD_AI_CREATOR=OFF

      - name: Build Runtime-only targets
        run: cmake --build build-runtime --config Release --target kadoka_othello_headless kadoka_othello_core_tests --parallel 2

      - name: Test Runtime-only build
        run: ctest --test-dir build-runtime -C Release --output-on-failure
